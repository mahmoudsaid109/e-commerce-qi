<div class="card h-100 border-0 shadow-sm product-card">
  <div class="product-image-container position-relative bg-light rounded-top overflow-hidden">

  <img
    [src]="product.image"
    [alt]="product.title"
    class="product-image"
    [routerLink]="['/products', product.id]"
    style="cursor: pointer;"
  />

  <span class="badge bg-white text-dark position-absolute top-0 start-0 m-3 shadow-sm">
    {{ product.category }}
  </span>

  @if (product.inStock) {
    <span class="badge bg-success position-absolute top-0 end-0 m-3">
      In Stock
    </span>
  } @else {
    <span class="badge bg-danger position-absolute top-0 end-0 m-3">
      Out of Stock
    </span>
  }
</div>
  <div class="card-body d-flex flex-column p-4">
    <h5 class="card-title fw-bold text-dark mb-2" [routerLink]="['/products', product.id]" style="cursor: pointer;">
      {{ product.title }}
    </h5>
    <p class="card-text text-muted small mb-3">
      {{ product.description }}
    </p>

    <div class="d-flex align-items-center gap-2 mb-3">
      <span class="text-warning"> ★ </span>

      <span class="fw-semibold">
        {{ product.rating.rate }}
      </span>

      <span class="text-muted small"> ({{ product.rating.count }} reviews) </span>
    </div>
    <div class="mt-auto">
      <div class="d-flex justify-content-between align-items-center">
        <span class="fs-4 fw-bold text-primary"> ${{ product.price }} </span>

        <button
          type="button"
          class="btn btn-primary px-3"
          (click)="onAddToCart()"
          [disabled]="!product.inStock"
        >
          <i class="bi bi-cart-plus me-1"></i>
          Add to Cart
        </button>
      </div>
    </div>
  </div>
</div>
