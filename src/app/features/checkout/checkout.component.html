<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 text-center">
      <div class="card shadow-sm border-0">
        <div class="card-body p-5">
          <h2 class="fw-bold mb-4">Checkout Process</h2>
          <p class="lead text-muted mb-4">You are about to securely purchase your items.</p>
          
          <div class="alert alert-info mb-4 text-start">
            <strong>Total Amount:</strong> ${{ cartService.totalPrice() | number:'1.2-2' }}
          </div>

          @if (!showForm) {
            <button class="btn btn-success btn-lg px-5 py-3 rounded-pill fw-bold" (click)="showForm = true">
              Proceed to Payment
            </button>
          } @else {
            <app-checkout-form (checkoutComplete)="processCheckout()"></app-checkout-form>
          }
        </div>
      </div>
    </div>
  </div>
</div>
